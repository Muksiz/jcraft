# Desktop override for pre-generating chunks (and optionally pre-rendering BlueMap).
# Used by scripts/pregen.sh:
#   docker compose -f compose.yaml -f compose.pregen.yaml ...

services:
  mc:
    restart: "no"
    ports: !override
      - "127.0.0.1:8100:8100"
    environment:
      MEMORY: ${PREGEN_MEMORY:-8G}
      # Rootless Podman: container root maps to your own user, so ./data stays
      # owned by you and sync-world.sh can read and write it.
      UID: 0
      GID: 0
      # Overwrite /data/config with the files below even though the mods rewrite them
      # at startup (the default skips destination files that are newer).
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
    volumes:
      - ./config/bluemap/core.pregen.conf:/config/bluemap/core.conf:ro,z
      - ./config/c2me.pregen.toml:/config/c2me.toml:ro,z
