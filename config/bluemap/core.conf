# BlueMap core config (Pi). Synced into /data/config/bluemap by the container.
# accept-download: true accepts Mojang's EULA for the client resources BlueMap
# needs to render (the server already runs with EULA=TRUE).
accept-download: true
data: "bluemap"
# One render thread so map updates never compete with the server tick on the Pi.
render-thread-count: 1
render-thread-priority: 1
update-cooldown: 60
full-update-interval: 1440
region-file-check-interval: 5
scan-for-mod-resources: true
metrics: true
log: {
  file: "bluemap/logs/debug.log"
  append: false
}
