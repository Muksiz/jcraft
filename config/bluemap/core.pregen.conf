# BlueMap core config for desktop pre-rendering (mounted by compose.pregen.yaml).
accept-download: true
data: "bluemap"
# All cores but two.
render-thread-count: -2
update-cooldown: 60
full-update-interval: 1440
region-file-check-interval: 5
scan-for-mod-resources: true
metrics: true
log: {
  file: "bluemap/logs/debug.log"
  append: false
}
