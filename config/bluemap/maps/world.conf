        type: "poi"
        label: "New Spawn"
        position: { x: 7761, y: 97, z: -4367 }
      }
      base: {
        type: "poi"
        label: "Base"
        position: { x: 7740, y: 63, z: -4642 }
      }
      # The shared edge of the two pre-generated squares (x = 12881, z -11184..6816):
      # west is plain vanilla, east was generated with the structure packs.
      square-border-line: {
        type: "line"
        label: "Border between squares"
        position: { x: 12881, y: 66, z: -2184 }
        line: [
          { x: 12881, y: 66, z: -11184 }
          { x: 12881, y: 66, z: 6816 }
