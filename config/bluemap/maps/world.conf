    label: "Places"
    toggleable: true
    default-hidden: false
    markers: {
      old-spawn: {
        type: "poi"
        label: "Old Spawn"
        position: { x: 0, y: 63, z: 0 }
      }
      # The world spawn in level.dat. Update this if /setworldspawn moves it.
