# BlueMap plugin config. Synced into /data/config/bluemap by the container.
# Everything except player-render-limit is BlueMap's default.
live-player-markers: true
hidden-game-modes: [
  "spectator"
]
hide-vanished: true
hide-invisible: true
hide-sneaking: false
hide-below-sky-light: 0
hide-below-block-light: 0
hide-different-world: false
skin-download: true
# Pause rendering while 2 or more players are online, so it never competes
# with a busy server tick on the Pi.
player-render-limit: 2
